<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メール認証</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .message { font-size: 1.2em; color: #333; }
        .spinner { border: 4px solid rgba(0,0,0,.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #007bff; animation: spin 1s infinite linear; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="status">
        <div class="spinner"></div>
        <p class="message" data-i18n="verifying">認証処理中です。しばらくお待ちください...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const statusDiv = document.getElementById('status');

            if (!token) {
                statusDiv.innerHTML = '<p class="message">❌ 認証トークンがありません。このページを閉じてください。</p>';
                return;
            }

            fetch(`/verify_api.php?token=${token}`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                statusDiv.innerHTML = '<p class="message">認証が完了しました。自動的にログインページへ移動します...</p>';

                // URLからトークンを削除（セキュリティ対策）
                history.replaceState(null, '', window.location.pathname);

                // 3秒後に index.html にリダイレクト
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
            })
            .catch(error => {
                statusDiv.innerHTML = '<p class="message">このページを閉じてください。</p>';
                console.error('Fetch error:', error);
            });
        });
    </script>
</body>
</html>
