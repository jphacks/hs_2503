<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アカウント登録</title>
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="register-container">
    <h2>アカウント登録</h2>
    <form id="registerForm">
      <input type="text" id="username" placeholder="ユーザー名" required><br>
      <input type="email" id="email" placeholder="メールアドレス" required><br>
      <input type="password" id="password" placeholder="パスワード（6文字以上）" minlength="6" required><br>
      <button type="submit">登録</button>
    </form>
    <p>すでにアカウントをお持ちの方は <a href="login.html">ログイン</a></p>
  </div>

  <script src="../js/register.js"></script>
</body>
</html>
