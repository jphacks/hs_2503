<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title data-i18n="register_title">アカウント登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="../css/register.css">
  <link rel="stylesheet" href="../css/header.css"> </head>
<body>
  
  <header id="header">
    <div class="header-content">
        <img src="../img/logo2.png" alt="hinavi" id="logo">

        <div id="header-right">
            
            <div class="back-to-home-header">
                <a href="../index.html" class="home-btn-link">← ホームへ</a>
            </div>
            
            <button class="header-icon-btn">
                <img src="../img/help.png" alt="Help">
            </button>

            <div id="language-wrapper">
                <button id="language-btn" class="header-icon-btn">
                    <img src="../img/language.png" alt="Language" />
                </button>
                <select id="language-select"> 
                  <option value="ja">日本語</option>
                  <option value="zh">中文</option>
                </select>
            </div>

            <div id="menu-container">
              <button id="menu-btn" class="header-icon-btn">
                <img src="../img/menu.png" alt="Menu">
              </button>
              <ul id="menu-list" class="hidden">
                <li id="menu-mypage"><a href="mypage.html">マイページ</a></li>
                <li id="menu-hinavi"><a href="hinavi.html">hinaviとは</a></li>
                <li id="menu-settings"><a href="settings.html">設定</a></li>
              </ul>
            </div>
        </div>
    </div>
  </header>
  <div class="register-container">
    <h2 data-i18n="register_heading">アカウント登録</h2>
    <form id="registerForm">
      <input type="text" id="username" data-i18n-placeholder="username" placeholder="ユーザー名" required><br>
      <input type="email" id="email" data-i18n-placeholder="email" placeholder="メールアドレス" required><br>
      <input type="password" id="password" data-i18n-placeholder="password" placeholder="パスワード（6文字以上）" minlength="6" required><br>
      <button type="submit" data-i18n="register_btn">登録</button>
    </form>
    <p data-i18n="have_account">
      すでにアカウントをお持ちの方は
      <a href="login.html" data-i18n="login_link">ログイン</a>
    </p>
  </div>

  <script>
    // --- ヘッダーの JavaScript ロジック (login.htmlから流用) ---
    document.addEventListener('DOMContentLoaded', () => {
        const menuBtn = document.getElementById('menu-btn');
        const menuList = document.getElementById('menu-list');
        const langBtn = document.getElementById('language-btn');
        const langSelect = document.getElementById('language-select');
        const menuContainer = document.getElementById('menu-container'); 
        
        // --- 1. メニューボタン機能 ---
        if (menuBtn && menuList) {
            menuBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                menuList.classList.toggle('hidden');
            });
            
            document.addEventListener('click', (event) => {
                if (menuContainer && !menuContainer.contains(event.target) && !menuList.classList.contains('hidden')) {
                    menuList.classList.add('hidden');
                }
            });
        }
        
        // --- 2. 言語ボタン（アイコン）機能 ---
        if (langBtn && langSelect) {
            
            const storedLang = localStorage.getItem("selectedLanguage") || "ja";
            langSelect.value = storedLang;

            langBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                langSelect.focus(); 
                menuList.classList.add('hidden');
            });
            
            langSelect.addEventListener('change', (event) => {
                const newLang = event.target.value;
                localStorage.setItem("selectedLanguage", newLang);
                alert("言語を " + (newLang === 'ja' ? '日本語' : '中文') + " に切り替えました。");
            });
        }
    });
  </script>
  
  <script src="../js/register.js"></script>
</body>
</html>
