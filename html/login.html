<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログインページ</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-container">
    <h2 data-i18n="login_heading">ログイン</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="ユーザー名" required><br>
      <input type="password" id="password" placeholder="パスワード" required><br>
      <button type="submit">ログイン</button>
    </form>
    <p><a href="register.html">アカウントをお持ちでない方はこちら</a></p>
    <p><a href="request-reset.html">パスワードを忘れた方はこちら</a></p>
    <p><a href="forgot-username.html">ユーザー名を忘れた方はこちら</a></p>
  </div>

  <script src="../js/login-lang.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
