<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title data-i18n="login_title">ログインページ</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body>
  <header id="header">
    <img src="../img/logo2.png" alt="hinavi" id="logo">

    <div id="header-right">
      <button id="back-to-home-btn" onclick="location.href='../index.html'">ホームに戻る</button>

      <button id="loginBtn" onclick="location.href='login.html'">ログイン</button>

      <button id="help-btn" onclick="location.href='help.html'">
        <img src="../img/help.png" alt="Help">
      </button>

      <div id="language-wrapper">
        <button id="language-btn">
          <img src="../img/language.png" alt="Language" />
        </button>
        <select id="language-select">
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div id="menu-container">
        <button id="menu-btn" class="header-icon-btn">
          <img src="../img/menu.png" alt="Menu">
        </button>
        <ul id="menu-list" class="hidden">
          <li id="menu-mypage"><a href="mypage.html">マイページ</a></li>
          <li id="menu-hinavi"><a href="hinavi.html">hinaviとは</a></li>
        </ul>
      </div>
    </div>
  </header>

  <div class="login-container">
    <h2 data-i18n="login_heading">ログイン</h2>
    <form id="loginForm">
      <input type="text" id="username" data-i18n-placeholder="username" placeholder="ユーザー名" required><br>
      <input type="password" id="password" data-i18n-placeholder="password" placeholder="パスワード" required><br>
      <button type="submit" data-i18n="login_btn">ログイン</button>
      <p data-i18n="no_account">アカウントをお持ちでない方は <br> <a href="register.html" data-i18n="register_link">こちらから登録</a></p>
    </form>
  </div>
  
  <script>
    // --- ヘッダーの JavaScript ロジック (変更なし) ---
    document.addEventListener('DOMContentLoaded', () => {
        const menuBtn = document.getElementById('menu-btn');
        const menuList = document.getElementById('menu-list');
        const langBtn = document.getElementById('language-btn');
        const langSelect = document.getElementById('language-select');
        const menuContainer = document.getElementById('menu-container'); 
        
        // --- 1. メニューボタン機能 ---
        if (menuBtn && menuList) {
            menuBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                menuList.classList.toggle('hidden');
            });
            
            document.addEventListener('click', (event) => {
                if (menuContainer && !menuContainer.contains(event.target) && !menuList.classList.contains('hidden')) {
                    menuList.classList.add('hidden');
                }
            });
        }
        
        // --- 2. 言語ボタン（アイコン）機能 ---
        if (langBtn && langSelect) {
            
            const storedLang = localStorage.getItem("selectedLanguage") || "ja";
            langSelect.value = storedLang;

            langBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                langSelect.focus(); 
                menuList.classList.add('hidden');
            });
            
            langSelect.addEventListener('change', (event) => {
                const newLang = event.target.value;
                localStorage.setItem("selectedLanguage", newLang);
                alert("言語を " + (newLang === 'ja' ? '日本語' : '中文') + " に切り替えました。");
            });
        }
    });
  </script>

  <script type="module">
    import { initLoginForm } from '../js/auth.js';
    document.addEventListener("DOMContentLoaded", () => {
      initLoginForm();
    });
  </script>
  <script src="../js/login-lang.js"></script>
  <script src="../js/menu.js" defer></script>
</body>
</html>
