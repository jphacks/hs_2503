<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログインページ</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>  
  <div class="login-container">
    <h2>ログイン</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="ユーザー名" required><br>
      <input type="password" id="password" placeholder="パスワード" required><br>
      <button type="submit">ログイン</button>
      <p>アカウントをお持ちでない方は <a href="register.html">こちらから登録</a></p>
    </form>
  </div>
  
  <!-- モジュールとして読み込む -->
  <script type="module">
    import { initLoginForm } from '../js/auth.js';
    document.addEventListener("DOMContentLoaded", () => {
      initLoginForm();
    });
  </script>
</body>
</html>
