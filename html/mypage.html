<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マイページ</title>
  <link rel="stylesheet" href="../css/mypage.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body>
  <header id="header">
    <img src="../img/logo2.png" alt="hinavi" id="logo">

    <div id="header-right">
      <button id="back-to-home-btn" onclick="location.href='../index.html'">ホームに戻る</button>

      <button id="loginBtn" onclick="location.href='login.html'">ログイン</button>

      <button id="help-btn" onclick="location.href='help.html'">
        <img src="../img/help.png" alt="Help">
      </button>

      <div id="language-wrapper">
        <button id="language-btn">
          <img src="../img/language.png" alt="Language" />
        </button>
        <select id="language-select">
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div id="menu-container">
        <button id="menu-btn" class="header-icon-btn">
          <img src="../img/menu.png" alt="Menu">
        </button>
        <ul id="menu-list" class="hidden">
          <li id="menu-mypage"><a href="mypage.html">マイページ</a></li>
          <li id="menu-hinavi"><a href="hinavi.html">hinaviとは</a></li>
        </ul>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>マイページ</h1>

    <div class="user-info">
      <p>ユーザ名: <span id="username"></span></p>
      <p>トロフィー: <span id="trophies">🏆🏆🏆</span></p>
    </div>

    <button onclick="window.history.back()">戻る</button>
  </div>

  <script type="module">
    // 💡 修正点 1: インポートする関数名を getAuthStatus に変更
    import { getAuthStatus } from '../js/auth.js';

    document.addEventListener("DOMContentLoaded", async () => { // 💡 修正点 2: DOMContentLoaded リスナーを async に変更
      try {
        // 💡 修正点 3: getAuthStatus を await で呼び出す
        const authInfo = await getAuthStatus(); 
        
        // 💡 修正点 4: 戻り値のオブジェクトからユーザー名を取得
        if (authInfo && authInfo.isLoggedIn) {
          document.getElementById("username").textContent = authInfo.username;
        } else {
          // ログインしていない、またはセッションが無効な場合
          alert("ログインしていません");
          window.location.href = "/index.html";
        }
      } catch (error) {
        console.error("認証状態の確認中にエラーが発生しました:", error);
        alert("認証処理中にエラーが発生しました。");
        window.location.href = "/index.html";
      }
    });
  </script>

  <script src="../js/lang.js" defer></script>
  <script src="../js/menu.js" defer></script>
</body>
</html>
