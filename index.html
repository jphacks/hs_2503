<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<title>hinavi 災害情報マップ</title>
<link rel="icon" href="img/icon2.png" type="image/png">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div id="header">
    <img src="img/logo2.png" alt="hinavi" id="logo">

    <div id="disaster-header" data-i18n="loading"></div>
    <div id="disaster-body"></div>

    <div id="header-right">
    <button id="loginBtn" class="login-btn">ログイン</button>

    <button id="help-btn">
      <img src="img/help.png" alt="Help">
    </button>

    <div id="language-wrapper">
      <button id="language-btn">
        <img src="img/language.png" alt="Language" />
      </button>

      <select id="language-select">
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <!-- メニュー -->
    <div id="menu-container">
      <button id="menu-btn">
        <img src="img/menu.png" alt="Menu">
      </button>
      <ul id="menu-list" class="hidden">
        <li id="menu-mypage"><a href="mypage.html">マイページ</a></li>
        <li id="menu-settings"><a href="settings.html">設定</a></li>
      </ul>
    </div>
</div>

  </div>

  <div id="container">
    <div id="reportDialog" class="report-dialog">
      <div class="report-header">
        <p data-i18n="question">この地点は？</p>
        <button id="close-report">×</button>
      </div>
      
      <div class="status-options">
        <label class="status-btn pass">
          <input type="radio" name="status" value="pass">
          <span data-i18n="pass">✅ 通れる</span>
        </label>
        <label class="status-btn fail">
          <input type="radio" name="status" value="fail">
          <span data-i18n="blocked">🚫 通れない</span>
        </label>
        <label class="status-btn step">
          <input type="radio" name="status" value="step">
          <span data-i18n="step">⚠️ 段差</span>
        </label>
        <label class="status-btn comment">
          <input type="radio" name="status" value="comment">
          <span data-i18n="comment_label">💬 コメント</span>
        </label>
      </div>   
      <textarea id="comment" data-i18n-placeholder="comment" placeholder="コメントを入力"></textarea>
      <button id="send-btn" data-i18n="send" onclick="submitReport()">送信</button>
    </div>
 
    <div id="shelter-wrapper">
      <p id="shelter-text">近くの避難所はこちら</p>
      <div id="shelter-list"></div>
    </div>
 
    <div id="map"></div>

    <button id="recenter-btn" onclick="recenterMap()">
      <img src="img/recenter.png" />
    </button>
  </div>

  <footer id="footer" data-i18n="footer">
    <span id="footer-left">© hinavi 2025</span>
    <div id="footer-right">
      情報提供：
      <a href="https://www.jma.go.jp/" target="_blank">気象庁</a> |
      <a href="https://www.jma.go.jp/bosai/" target="_blank">防災情報ポータル</a>
    </div>
  </footer>
 
  <script>
    // グローバル設定
    window.GOOGLE_MAPS_API_KEY = "AIzaSyDXnEdO-AhnxDLo_w-mrUdO8_kJMMndgM0"; 
    window.currentLang = localStorage.getItem("selectedLanguage") || "ja";

    let latestPosition = null;
    window.setLatestPosition = (pos) => {
      latestPosition = pos;
      window.userLat = pos?.lat;
      window.userLng = pos?.lng;
      if (window.map && window.reloadShelters) reloadShelters();
    };
    window.getLatestPosition = () => latestPosition;
  </script>

  <!-- 各種機能の JS -->
  <script src="js/init.js" defer></script>
  <script src="js/shelters.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/disaster-info.js" defer></script>
  <script src="js/report.js" defer></script>
  <script src="js/lang.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/menu.js" defer></script>


  <!-- ログイン状態反映用のモジュール -->
<script type="module">
  import { initAuthStatus } from './js/authStatus.js';
  import { initLoginForm } from './js/auth.js';
  document.addEventListener("DOMContentLoaded", () => {
    initAuthStatus();
    initLoginForm();
  });
</script>


</body>
</html>
