<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hinavi 災害情報マップ</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!-- ヘッダー -->
  <div id="header">
    <img src="img/logo1.png" alt="hinavi_logo" id="logo">
    <button id="recenter-btn" onclick="recenterMap()">現在地に戻る</button>

    <!-- 🌐 言語設定セレクト -->
    <select id="language-select">
      <option value="ja">日本語</option>
      <!--option value="en">English</option-->
      <option value="zh">中文</option>
      <!--option value="es">Español</option-->
    </select>
  </div>

  <!-- 災害情報バー -->
  <div id="disaster-info" data-i18n="loading">読み込み中...</div>

  <!-- メインコンテナ -->
  <div id="container">
    <!-- ✅ 通行報告フォーム -->
    <div id="reportDialog"
        style="display:none; position:fixed; bottom:20px; left:20px; background:white; padding:10px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.3); z-index:9999;">
      <p data-i18n="question">この地点は？</p>
      <button onclick="submitReport('pass')" data-i18n="pass">✅ 通れる</button>
      <button onclick="submitReport('blocked')" data-i18n="blocked">🚫 通れない</button><br>
      <textarea id="comment" data-i18n-placeholder="comment" placeholder="補足コメント..." style="width:200px; height:50px; margin-top:5px;"></textarea>
    </div>

    <!-- 避難所カードリスト -->
    <div id="shelter-list"></div>

    <!-- Google Map -->
    <div id="map"></div>
  </div>

  <!-- フッター -->
  <footer id="footer" data-i18n="footer">© hinavi 2025 all rights reserved.</footer>

  <!-- メインスクリプト -->
  <script>
    const GOOGLE_MAPS_API_KEY = "AIzaSyDXnEdO-AhnxDLo_w-mrUdO8_kJMMndgM0";
    window.currentLang = "ja";
    let currentScript = null;

    // 最新位置管理
    let latestPosition = null;
    window.setLatestPosition = (pos) => {
      latestPosition = pos;
      window.userLat = pos?.lat;
      window.userLng = pos?.lng;
      if (window.map && window.reloadShelters) reloadShelters();
    };
    window.getLatestPosition = () => latestPosition;

    function loadGoogleMaps(lang = "ja") {
      console.log(`🌐 言語切り替え → ${lang}`);
      window.currentLang = lang;
      if (window.stopTracking) window.stopTracking();
      if (currentScript) { currentScript.remove(); currentScript = null; }
      document.getElementById("map").innerHTML = "";

      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&language=${lang}&callback=initMap`;
      script.defer = true;
      script.async = true;
      document.head.appendChild(script);
      currentScript = script;
    }

    // 言語切り替えイベント
    document.getElementById("language-select").addEventListener("change", (e) => {
      const newLang = e.target.value;
      loadGoogleMaps(newLang);
      if (window.loadDisasterInfo) window.loadDisasterInfo(); // ✅ 災害情報も再読込
    });

    // 初回
    loadGoogleMaps(window.currentLang);
  </script>

  <!-- 各種スクリプト -->
  <script src="js/shelters.js"></script>
  <script src="js/map.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/disaster-info.js"></script>
  <script src="js/report.js"></script>
  <script src="js/lang.js"></script>
</body>
</html>
